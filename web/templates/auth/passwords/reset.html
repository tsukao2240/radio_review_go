{{ template "base" . }}

{{ define "content" }}
<title>新しいパスワードの設定</title>

<div class="max-w-md mx-auto px-4">
  <div class="card-base">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-6">
      <i class="fas fa-lock mr-2"></i>新しいパスワードの設定
    </h1>

    {{ with .Data }}
    {{ if index . "Error" }}
    <div class="mb-4 p-3 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-700 rounded-lg text-red-700 dark:text-red-300 text-sm">
      {{ index . "Error" }}
    </div>
    {{ end }}

    <form method="POST" action="/password/update">
      <input type="hidden" name="token" value="{{ index . "Token" }}">
      <input type="hidden" name="email" value="{{ index . "Email" }}">

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">メールアドレス</label>
        <input type="email" value="{{ index . "Email" }}" readonly disabled
               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400">
      </div>

      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">新しいパスワード</label>
        <input type="password" id="password" name="password" required autofocus minlength="8" placeholder="8文字以上"
               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-400">
      </div>

      <div class="mb-6">
        <label for="password_confirmation" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">新しいパスワード（確認）</label>
        <input type="password" id="password_confirmation" name="password_confirmation" required minlength="8" placeholder="もう一度入力"
               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-400">
      </div>

      <button type="submit"
              class="w-full py-3 bg-primary-500 text-white font-bold rounded-lg hover:bg-primary-600 transition">
        パスワードを更新する
      </button>
    </form>
    {{ end }}

    <div class="mt-4 text-center">
      <a href="/login" class="text-sm text-primary-600 dark:text-primary-400 hover:underline">ログインに戻る</a>
    </div>
  </div>
</div>
{{ end }}
