{{ template "base" . }}

{{ define "content" }}
<title>会員登録</title>

<div class="max-w-md mx-auto px-4">
  <div class="card-base">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-6">
      <i class="fas fa-user-plus mr-2"></i>会員登録
    </h1>

    {{ if .Flash }}
    <div class="mb-4 p-3 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-700 rounded-lg text-red-700 dark:text-red-300 text-sm">
      {{ .Flash }}
    </div>
    {{ end }}

    <form method="POST" action="/register">
      <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">

      <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">名前</label>
        <input id="name" type="text" name="name" required autocomplete="name" autofocus
               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-400">
      </div>

      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">メールアドレス</label>
        <input id="email" type="email" name="email" required autocomplete="email"
               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-400">
      </div>

      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">パスワード</label>
        <input id="password" type="password" name="password" required autocomplete="new-password"
               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-400">
      </div>

      <div class="mb-6">
        <label for="password-confirm" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">パスワード確認</label>
        <input id="password-confirm" type="password" name="password_confirmation" required autocomplete="new-password"
               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-400">
      </div>

      <button type="submit"
              class="w-full py-3 bg-primary-500 text-white font-bold rounded-lg hover:bg-primary-600 transition">
        会員登録
      </button>
    </form>
  </div>
</div>
{{ end }}
