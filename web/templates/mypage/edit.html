{{ template "base" . }}

{{ define "content" }}
<title>レビューの編集</title>

{{ with .Data }}
{{ $post := index . "Post" }}
{{ $tags := index . "Tags" }}

<div class="max-w-2xl mx-auto px-4">
  <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-6">
    <i class="fas fa-edit mr-2"></i>レビューの編集
  </h1>

  <div class="card-base">
    <form method="POST" action="/my/edit/{{ $post.ID }}">
      <input type="hidden" name="_csrf" value="{{ $.CSRFToken }}">
      <input type="hidden" name="id" value="{{ $post.ID }}">
      <input type="hidden" name="user_id" value="{{ $post.UserID }}">
      <input type="hidden" name="program_id" value="{{ $post.ProgramID }}">
      <input type="hidden" name="program_title" value="{{ $post.ProgramTitle }}">

      <div class="mb-4">
        <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">タイトル</label>
        <input type="text" name="title" id="title" value="{{ $post.Title }}"
               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-400">
      </div>

      <div class="mb-4">
        <label for="body" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">内容</label>
        <textarea name="body" id="body" rows="10"
                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-400 resize-y">{{ $post.Body }}</textarea>
      </div>

      <div class="mb-4">
        <label for="rating" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">評価</label>
        <select name="rating" id="rating"
                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-400">
          <option value="5" {{ if eq $post.Rating 5 }}selected{{ end }}>★★★★★ (5)</option>
          <option value="4" {{ if eq $post.Rating 4 }}selected{{ end }}>★★★★☆ (4)</option>
          <option value="3" {{ if eq $post.Rating 3 }}selected{{ end }}>★★★☆☆ (3)</option>
          <option value="2" {{ if eq $post.Rating 2 }}selected{{ end }}>★★☆☆☆ (2)</option>
          <option value="1" {{ if eq $post.Rating 1 }}selected{{ end }}>★☆☆☆☆ (1)</option>
        </select>
      </div>

      {{ if $tags }}
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">タグ（複数選択可）</label>
        <div class="flex flex-wrap gap-2">
          {{ range $tags }}
          <label class="inline-flex items-center gap-1 cursor-pointer">
            <input type="checkbox" name="tags[]" value="{{ .ID }}" id="tag-{{ .ID }}"
                   class="rounded border-gray-300 text-primary-500 focus:ring-primary-400">
            <span class="text-sm text-gray-700 dark:text-gray-300">{{ .Name }}</span>
          </label>
          {{ end }}
        </div>
      </div>
      {{ end }}

      <button type="submit"
              class="w-full py-3 bg-primary-500 text-white font-bold rounded-lg hover:bg-primary-600 transition">
        <i class="fas fa-save mr-1"></i>編集する
      </button>
    </form>
  </div>
</div>
{{ end }}
{{ end }}
